<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กิจกรรมสานสัมพันธ์ ศาลเด็กประจวบเกมส์</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;600;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --font-scale: 1.4;
        }

        body {
            font-family: 'Prompt', sans-serif;
            /* พื้นหลัง Modern Dark */
            background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 30%, #1a365d 60%, #0d1b2a 100%);
            background-size: cover;
            transition: background 0.5s ease-in-out;
            min-height: 100vh;
        }

        /* --- LIGHT MODE STYLES --- */
        body.light-mode {
            color: #1a365d;
            /* พื้นหลัง Modern Light */
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
        }
  
        body.light-mode .backdrop-overlay {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
        }

        /* ปรับสีตัวอักษรในโหมดสว่าง */
        body.light-mode .text-white { color: #1e3a5f !important; }
        body.light-mode .text-gray-400 { color: #64748b !important; }
        body.light-mode .border-gray-500\/30 { border-color: rgba(0,0,0,0.1) !important; }
        
        /* เปลี่ยนสีส่วน History ด้านล่างในโหมดสว่าง */
        body.light-mode .history-section {
            background-color: rgba(255, 255, 255, 0.5) !important;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        
        body.light-mode .control-btn {
            background-color: rgba(255,255,255,0.9);
            color: #333;
            border-color: #ccc;
        }

        /* --- CARD COLOR STYLES (หัวใจสำคัญของการปรับสีจางๆ) --- */
        
        /* 1. สีม่วง (Purple) */
        .card-purple {
            background: rgba(88, 28, 135, 0.25); /* Dark: ม่วงเข้มจางๆ */
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.1);
        }
        body.light-mode .card-purple {
            background: rgba(243, 232, 255, 0.9); /* Light: ม่วงพาสเทล */
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.15);
        }

        /* 2. สีแดง (Red) */
        .card-red {
            background: rgba(153, 27, 27, 0.25); /* Dark: แดงเข้มจางๆ */
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.1);
        }
        body.light-mode .card-red {
            background: rgba(254, 226, 226, 0.9); /* Light: แดงพาสเทล */
            border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.15);
        }

        /* 3. สีเหลือง (Yellow) */
        .card-yellow {
            background: rgba(113, 63, 18, 0.3); /* Dark: เหลืองโคลนจางๆ (เพื่อให้เห็นตัวหนังสือ) */
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.1);
        }
        body.light-mode .card-yellow {
            background: rgba(254, 252, 232, 0.9); /* Light: เหลืองครีม */
            border: 1px solid rgba(234, 179, 8, 0.2);
            box-shadow: 0 10px 20px rgba(234, 179, 8, 0.15);
        }

        /* 4. สีน้ำเงิน (Blue) */
        .card-blue {
            background: rgba(30, 58, 138, 0.3); /* Dark: น้ำเงินเข้มจางๆ */
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }
        body.light-mode .card-blue {
            background: rgba(219, 234, 254, 0.9); /* Light: ฟ้าพาสเทล */
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.15);
        }

        /* 5. สีฟ้า (Cyan) */
        .card-cyan {
            background: rgba(22, 78, 99, 0.3);
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.1);
        }
        body.light-mode .card-cyan {
            background: rgba(207, 250, 254, 0.9);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.15);
        }

        /* ---------------------------------------------------- */

        .backdrop-overlay { 
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(8px); 
            transition: all 0.5s ease;
        }

        .score-card { 
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: visible; 
        }

        .score-number {
            font-size: calc(6rem * var(--font-scale));
            line-height: 1;
            transition: font-size 0.2s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Neon Text Logic */
        .neon-text {
            text-shadow: 0 0 1px currentColor, 0 0 10px currentColor;
        }
        body.light-mode .neon-text {
            text-shadow: 3px 3px 0px rgba(0,0,0,0.1) !important;
            filter: drop-shadow(0 0 0 transparent);
        }

        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
        .history-scroll::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }

        @media (min-width: 768px) { .score-number { font-size: calc(7rem * var(--font-scale)); } }
        @media (min-width: 1280px) { .score-number { font-size: calc(8rem * var(--font-scale)); } }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-white">

    <div class="backdrop-overlay w-full h-full flex flex-col items-center justify-center p-4">
        
        <header class="mb-8 text-center animate__animated animate__fadeInDown flex-shrink-0 relative z-10">
            <h2 class="text-xl md:text-3xl font-bold text-yellow-50 tracking-widest mb-2 drop-shadow-[0_2px_2px_rgba(0,0,0,1)] uppercase">
                🏆 กิจกรรมสานสัมพันธ์ <span class="text-yellow-400">ศาลเด็กประจวบเกมส์</span>
            </h2>
        
            <div class="relative inline-block px-4">
                <h1 id="sport-title" 
                    class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-b from-[#FFD700] via-[#FF8C00] to-[#8B4500] tracking-wide filter drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]"
                    style="-webkit-text-stroke: 1px rgba(255, 255, 255, 0.1); text-shadow: 0px 2px 0px #b45309;">
                    กำลังโหลด...
                </h1>
                
                <div class="w-full h-2 bg-gradient-to-r from-transparent via-[#FFD700] to-transparent mt-2 rounded-full opacity-90 blur-[1px]"></div>
                <div class="w-full h-1 bg-gradient-to-r from-transparent via-[#FFF] to-transparent -mt-1.5 rounded-full opacity-60"></div>
            </div>
        </header>

        <div id="score-container" class="grid gap-6 w-full max-w-[95%] h-full max-h-[85vh] overflow-y-auto pb-4 pt-10 px-2 transition-all duration-500">
            <div class="col-span-1 md:col-span-2 lg:col-span-4 flex justify-center items-center h-64 animate-pulse">
                <div class="text-xl text-gray-400 flex flex-col items-center">
                    กำลังเชื่อมต่อ Google Sheets...
                </div>
            </div>
        </div>
        
        <div id="error-msg" class="hidden absolute bottom-5 left-5 bg-red-600/90 px-6 py-3 rounded-full text-sm font-bold shadow-lg animate__animated animate__fadeInUp"></div>

        <div class="fixed bottom-5 right-5 flex gap-2 z-50 animate__animated animate__fadeInRight">
            <button onclick="toggleTheme()" class="control-btn w-10 h-10 bg-indigo-600/90 hover:bg-indigo-500 text-white rounded-full flex items-center justify-center border border-indigo-400 shadow-lg transition-all active:scale-95 mr-2">
                <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
            </button>
            <button onclick="adjustFontSize(-0.1)" class="control-btn w-10 h-10 bg-gray-800/80 hover:bg-gray-700 text-white rounded-full flex items-center justify-center border border-gray-600 shadow-lg transition-all active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
            </button>
            <div class="control-btn flex items-center justify-center bg-gray-900/80 px-2 rounded-lg border border-gray-700 text-xs text-gray-400 font-bold">SIZE</div>
            <button onclick="adjustFontSize(0.1)" class="control-btn w-10 h-10 bg-gray-800/80 hover:bg-gray-700 text-white rounded-full flex items-center justify-center border border-gray-600 shadow-lg transition-all active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            </button>
        </div>

    </div>

    <script src="config.js"></script>

    <script>
        const SHEET_ID = (typeof CONFIG !== 'undefined') ? CONFIG.SHEET_ID : '';
        const SHEET_NAME = (typeof CONFIG !== 'undefined') ? CONFIG.SHEET_NAME : 'Sheet1';
        const REFRESH_RATE = (typeof CONFIG !== 'undefined') ? CONFIG.REFRESH_RATE : 2000;

        let previousScores = {};
        let currentScale = 1.4; 

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            const icon = document.getElementById('theme-icon');
            if (isLight) {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
            } else {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />';
            }
        }

        function adjustFontSize(delta) {
            currentScale += delta;
            if (currentScale < 0.5) currentScale = 0.5;
            if (currentScale > 2.0) currentScale = 2.0;
            document.documentElement.style.setProperty('--font-scale', currentScale);
        }

        window.displayScores = function(json) {
            try {
                if (!json.table || !json.table.rows) throw new Error("ไม่พบข้อมูล");
                const rows = json.table.rows;
                const cols = json.table.cols;

                const sportName = cols[0].label;
                if (sportName && sportName.trim() !== "") {
                    document.getElementById('sport-title').innerText = sportName;
                }
                
                const teams = rows.map(r => {
                    const name = r.c[0]?.v || ''; 
                    const score = (r.c[1]?.v !== null && r.c[1]?.v !== undefined) ? r.c[1].v : 0;
                    const color = r.c[2]?.v || 'red';
                    
                    let history = [];
                    if (r.c.length > 3) {
                        for(let i = 3; i < r.c.length; i++) {
                            if(r.c[i] && r.c[i].v !== null && r.c[i].v !== "") {
                                history.push({ round: cols[i].label, val: r.c[i].v });
                            }
                        }
                    }
                    return { name, score, color, history };
                }).filter(t => t.name !== ''); 

                renderBoard(teams);
                document.getElementById('error-msg').classList.add('hidden');
            } catch (err) {
                console.error(err);
                if (!SHEET_ID) {
                    const errDiv = document.getElementById('error-msg');
                    errDiv.innerHTML = "⚠️ ไม่พบไฟล์ config.js หรือ SHEET_ID ไม่ถูกต้อง";
                    errDiv.classList.remove('hidden');
                }
            }
        };

        function fetchScores() {
            if (!SHEET_ID) return;
            const script = document.createElement('script');
            const apiUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:displayScores&sheet=${SHEET_NAME}&_=${Date.now()}`;
            script.src = apiUrl;
            document.body.appendChild(script);
            script.onload = () => { setTimeout(() => document.body.removeChild(script), 100); };
        }

        function renderBoard(teams) {
            const container = document.getElementById('score-container');
            let html = '';
            
            // Grid Adjustments
            let baseClasses = "grid gap-6 w-full max-w-[95%] h-full max-h-[85vh] overflow-y-auto pb-4 pt-10 px-2 transition-all duration-500";
            if (teams.length <= 2) {
                container.className = `${baseClasses} grid-cols-1 md:grid-cols-2`;
            } else {
                container.className = `${baseClasses} grid-cols-1 md:grid-cols-2 lg:grid-cols-4`;
            }
            
            const maxScore = Math.max(...teams.map(t => t.score));
            const minScore = Math.min(...teams.map(t => t.score));

            teams.forEach((team) => {
                const isChanged = previousScores[team.name] !== undefined && previousScores[team.name] !== team.score;
                const animationClass = isChanged ? 'animate__animated animate__heartBeat' : '';
                
                // Color mapping logic
                const colorKey = team.color ? team.color.toLowerCase() : 'red';
                
                // 1. เลือก Class ตามสี (CSS จัดการเรื่อง Dark/Light ให้เอง)
                let cardClass = 'card-red'; // default
                if (colorKey.includes('purple') || colorKey.includes('ม่วง')) cardClass = 'card-purple';
                else if (colorKey.includes('yellow') || colorKey.includes('เหลือง')) cardClass = 'card-yellow';
                else if (colorKey.includes('blue') || colorKey.includes('น้ำเงิน')) cardClass = 'card-blue';
                else if (colorKey.includes('cyan') || colorKey.includes('ฟ้า')) cardClass = 'card-cyan';
                else if (colorKey.includes('red') || colorKey.includes('แดง')) cardClass = 'card-red';

                // Neon Text Color Mapping
                const colorMap = {
                    'purple': 'text-purple-500', 'สีม่วง': 'text-purple-500', 'ม่วง': 'text-purple-500',
                    'red': 'text-red-500', 'สีแดง': 'text-red-500', 'แดง': 'text-red-500',
                    'yellow': 'text-yellow-400', 'สีเหลือง': 'text-yellow-400', 'เหลือง': 'text-yellow-400',
                    'blue': 'text-blue-500', 'สีน้ำเงิน': 'text-blue-500', 'น้ำเงิน': 'text-blue-500',
                    'cyan': 'text-cyan-400'
                };
                
                // Default text color logic
                let textColor = colorMap[colorKey] || 'text-white';
                // ถ้าหาไม่เจอใน map ลองดูว่า key มีคำว่าอะไรบ้าง
                if(textColor === 'text-white') {
                     if (colorKey.includes('purple')) textColor = 'text-purple-500';
                     else if (colorKey.includes('blue')) textColor = 'text-blue-500';
                     else if (colorKey.includes('yellow')) textColor = 'text-yellow-400';
                     else if (colorKey.includes('red')) textColor = 'text-red-500';
                }

                const leaderBadge = (team.score === maxScore && team.score > minScore) 
                    ? `<div class="absolute -top-12 left-1/2 transform -translate-x-1/2 text-6xl animate__animated animate__bounceIn z-20">👑</div>` : '';
                const loserBadge = (team.score === minScore && team.score < maxScore)
                    ? `<div class="absolute -top-12 left-1/2 transform -translate-x-1/2 text-6xl animate__animated animate__pulse animate__infinite z-20">🐷</div>` : '';
                
                const cardMood = (team.score === minScore && team.score < maxScore) ? 'brightness-90 grayscale-[0.2]' : '';

                let historyHtml = team.history.length > 0 
                    ? team.history.slice().reverse().map(h => `<div class="flex justify-between items-center text-sm py-1 border-b border-gray-500/30 last:border-0"><span class="text-gray-400">${h.round}</span><span class="font-bold ${textColor}">+${h.val}</span></div>`).join('') 
                    : `<div class="text-center text-xs text-gray-400 py-2">- ยังไม่มีคะแนน -</div>`;

                html += `
                    <div class="relative score-card ${cardClass} backdrop-blur-xl rounded-2xl flex flex-col ${cardMood} h-full min-h-[350px] mt-2 transition-colors duration-500">
                        ${leaderBadge}
                        ${loserBadge}
                        <div class="flex flex-col items-center justify-center p-4 pb-2 flex-grow pt-8"> 
                            <div class="text-xl md:text-2xl font-bold text-white mb-1 drop-shadow-md tracking-wider text-center">${team.name}</div>
                            <div class="score-number font-black ${textColor} ${animationClass} neon-text">
                                ${team.score}
                            </div>
                        </div>
                        <div class="history-section bg-black/20 w-full p-4 rounded-b-2xl border-t border-gray-500/20">
                            <div class="flex items-center gap-2 mb-2"><span class="text-xs font-bold uppercase tracking-widest text-gray-400 opacity-70">History</span><div class="h-[1px] bg-gray-500/30 flex-grow"></div></div>
                            <div class="history-scroll overflow-y-auto max-h-[100px] pr-2">${historyHtml}</div>
                        </div>
                    </div>
                `;
                previousScores[team.name] = team.score;
            });
            container.innerHTML = html;
        }

        fetchScores();
        setInterval(fetchScores, REFRESH_RATE);
    </script>
</body>
</html>
